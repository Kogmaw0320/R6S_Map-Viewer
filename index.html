<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>R6S Map Viewer</title>
    <style>
        body { display: flex; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111; color: #fff; height: 100vh; overflow: hidden; }
        #sidebar { width: 240px; background: #222; height: 100vh; padding: 15px; box-sizing: border-box; overflow-y: auto; flex-shrink: 0; }
        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-track { background: #1a1a1a; }
        #sidebar::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        #sidebar::-webkit-scrollbar-thumb:hover { background: #ffb703; }
        #content { flex: 1; padding: 15px; text-align: center; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        .map-btn { display: block; width: 100%; padding: 10px; margin-bottom: 8px; background: #333; color: #fff; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; text-align: left; transition: all 0.15s ease-in-out; border-left: 0 solid transparent; }
        .map-btn:hover, .map-btn.active { background: #444; border-left: 4px solid #ffb703; }
        .floor-btn { padding: 8px 16px; margin: 4px; background: #2196F3; color: #fff; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; transition: all 0.15s ease-in-out; }
        .floor-btn:hover, .floor-btn.active { background: #0b7dda; outline: 2px solid #fff; }
        #floor-buttons { margin: 10px 0; min-height: 40px; }
        .mode-btn { padding: 8px 16px; margin: 0 4px; background: #444; color: #fff; border: 1px solid #666; cursor: pointer; border-radius: 4px; font-weight: bold; transition: background 0.15s; }
        .mode-btn.active { background: #ffb703; color: #000; border-color: #ffb703; }
        #canvas-container { flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; padding: 10px; background: #151515; border-radius: 8px; }
        canvas { border: 2px solid #444; box-shadow: 0px 0px 15px rgba(0,0,0,0.5); background-size: contain; background-repeat: no-repeat; background-position: center; background-color: #222; cursor: crosshair; max-width: 100%; max-height: 100%; display: block; transform: translateZ(0); will-change: transform; }
        .clear-btn { padding: 8px 16px; background: #e63946; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 10px; transition: background 0.15s; }
        .clear-btn:hover { background: #c32f3a; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2 style="color: #ffb703; margin-top: 0;">MAPS</h2>
        <div id="map-box"></div>
    </div>

    <div id="content">
        <h1 id="map-title" style="margin: 0 0 5px 0; font-size: 24px;">맵을 선택하세요</h1>
        <div id="floor-buttons"></div>

        <div style="margin-bottom: 15px; background: #222; padding: 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 12px; flex-shrink: 0; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
            <button id="btn-draw" class="mode-btn active" onclick="setMode('draw')">✏️ 그리기 모드</button>
            <button id="btn-erase" class="mode-btn" onclick="setMode('erase')">🧽 지우개 모드</button>
            <span style="color: #555;">|</span>
            <span style="font-weight: bold; font-size: 14px;">색상:</span>
            <input type="color" id="brush-color" value="#ff0000" style="cursor: pointer; width: 35px; height: 25px; border: none; border-radius: 4px; background: transparent;">
            <span style="color: #555;">|</span>
            <span style="font-weight: bold; font-size: 14px;">굵기: <span id="size-indicator" style="color: #ffb703;">5</span></span>
            <input type="range" id="brush-size" min="2" max="30" value="5" style="cursor: pointer; width: 100px; accent-color: #2196F3;">
            <span style="color: #555;">|</span>
            <button class="clear-btn" onclick="clearCanvas()">전체 초기화</button>
        </div>
        <div style="margin-bottom: 15px; background: #222; padding: 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 12px; flex-shrink: 0; box-shadow: 0 4px 6px rgba(0,0,0,0.3); max-width: 100%; overflow-x: auto;">
            <button id="btn-stamp" class="mode-btn" onclick="setMode('stamp')">🎯 아이콘 모드</button>
            <span style="color: #555;">|</span>
            <span style="font-weight: bold; font-size: 14px;">아이콘 선택:</span>
            <select id="stamp-selector" onchange="setMode('stamp')" style="background: #333; color: #fff; padding: 5px; border: 1px solid #555; border-radius: 4px; cursor: pointer; font-weight: bold;">
                <optgroup label="⚔️ 공격팀 (Attakers)">
					<option value="images/operators/striker.png">스트라이커 (Striker)</option>
                    <option value="images/operators/sledge.png">슬렛지 (Sledge)</option>
                    <option value="images/operators/thatcher.png">대처 (Thatcher)</option>
                    <option value="images/operators/ash.png">애쉬 (Ash)</option>
                    <option value="images/operators/thermite.png">써마이트 (Thermite)</option>
                    <option value="images/operators/twitch.png">트위치 (Twitch)</option>
                    <option value="images/operators/montagne.png">몽타뉴 (Montagne)</option>
                    <option value="images/operators/glaz.png">글라즈 (Glaz)</option>
                    <option value="images/operators/fuze.png">퓨즈 (Fuze)</option>
                    <option value="images/operators/blitz.png">블리츠 (Blitz)</option>
                    <option value="images/operators/iq.png">아이큐 (IQ)</option>
                    <option value="images/operators/buck.png">벅 (Buck)</option>
                    <option value="images/operators/blackbeard.png">블랙비어드 (Blackbeard)</option>
                    <option value="images/operators/capitao.png">카피탕 (Capitão)</option>
                    <option value="images/operators/hibana.png">히바나 (Hibana)</option>
                    <option value="images/operators/jackal.png">자칼 (Jackal)</option>
                    <option value="images/operators/ying.png">잉 (Ying)</option>
                    <option value="images/operators/zofia.png">조피아 (Zofia)</option>
                    <option value="images/operators/dokkaebi.png">도깨비 (Dokkaebi)</option>
                    <option value="images/operators/lion.png">라이언 (Lion)</option>
                    <option value="images/operators/finka.png">핀카 (Finka)</option>
                    <option value="images/operators/maverick.png">매버릭 (Maverick)</option>
                    <option value="images/operators/nomad.png">노마드 (Nomad)</option>
                    <option value="images/operators/gridlock.png">그리드락 (Gridlock)</option>
                    <option value="images/operators/nook.png">뇌크 (Nøkk)</option>
                    <option value="images/operators/amaru.png">아마루 (Amaru)</option>
                    <option value="images/operators/kali.png">칼리 (Kali)</option>
                    <option value="images/operators/iana.png">야나 (Iana)</option>
                    <option value="images/operators/ace.png">에이스 (Ace)</option>
                    <option value="images/operators/zero.png">제로 (Zero)</option>
                    <option value="images/operators/flores.png">플로레스 (Flores)</option>
                    <option value="images/operators/osa.png">오사 (Osa)</option>
                    <option value="images/operators/sens.png">센스 (Sens)</option>
                    <option value="images/operators/grim.png">그림 (Grim)</option>
                    <option value="images/operators/brava.png">브라바 (Brava)</option>
                    <option value="images/operators/ram.png">람 (Ram)</option>
                    <option value="images/operators/deimos.png">데이모스 (Deimos)</option>
					<option value="images/operators/rauora.png">라우오라 (Rauora)</option>
					<option value="images/operators/solid snake.png">솔리드 스네이크 (Solid Snake)</option>
                </optgroup>
                <optgroup label="🛡️ 수비팀 (Defenders)">
					<option value="images/operators/sentry.png">센트리 (Sentry)</option>
                    <option value="images/operators/smoke.png">스모크 (Smoke)</option>
                    <option value="images/operators/mute.png">뮤트 (Mute)</option>
                    <option value="images/operators/castle.png">캐슬 (Castle)</option>
                    <option value="images/operators/pulse.png">펄스 (Pulse)</option>
                    <option value="images/operators/doc.png">닥 (Doc)</option>
                    <option value="images/operators/rook.png">록 (Rook)</option>
                    <option value="images/operators/kapkan.png">캅칸 (Kapkan)</option>
                    <option value="images/operators/tachanka.png">타찬카 (Tachanka)</option>
                    <option value="images/operators/jager.png">예거 (Jäger)</option>
                    <option value="images/operators/bandit.png">밴딧 (Bandit)</option>
                    <option value="images/operators/frost.png">프로스트 (Frost)</option>
                    <option value="images/operators/valkyrie.png">발키리 (Valkyrie)</option>
                    <option value="images/operators/caveira.png">카베이라 (Caveira)</option>
                    <option value="images/operators/echo.png">에코 (Echo)</option>
                    <option value="images/operators/mira.png">미라 (Mira)</option>
                    <option value="images/operators/lesion.png">리전 (Lesion)</option>
                    <option value="images/operators/ela.png">엘라 (Ela)</option>
                    <option value="images/operators/vigil.png">비질 (Vigil)</option>
                    <option value="images/operators/maestro.png">마에스트로 (Maestro)</option>
                    <option value="images/operators/alibi.png">알리바이 (Alibi)</option>
                    <option value="images/operators/clash.png">클래시 (Clash)</option>
                    <option value="images/operators/kaid.png">카이드 (Kaid)</option>
                    <option value="images/operators/mozzi.png">모찌 (Mozzie)</option>
					<option value="images/operators/warden.png">워든 (Warden)</option>
					<option value="images/operators/goyo.png">고요 (Goyo)</option>
                    <option value="images/operators/wamai.png">와마이 (Wamai)</option>
                    <option value="images/operators/oryx.png">오릭스 (Oryx)</option>
                    <option value="images/operators/melusi.png">멜루시 (Melusi)</option>
                    <option value="images/operators/aruni.png">아루니 (Aruni)</option>
                    <option value="images/operators/thunderbird.png">썬더버드 (Thunderbird)</option>
                    <option value="images/operators/thorn.png">쏜 (Thorn)</option>
                    <option value="images/operators/azami.png">아자미(Azami)</option>
                    <option value="images/operators/solis.png">솔리스 (Solis)</option>
                    <option value="images/operators/fenrir.png">펜리르 (Fenrir)</option>
                    <option value="images/operators/tubarao.png">투바랑 (Tubarão)</option>
					<option value="images/operators/skopos.png">스코포스 (Skopos)</option>
					<option value="images/operators/denari.png">데나리 (Denari)</option>
					<option value="images/operators/noor.png">누르 (Noor)</option>
                </optgroup>
                <optgroup label="💣 가젯류 (Gadgets)">
                    <option value="images/gadgets/frag.png">수류탄</option>
                    <option value="images/gadgets/smoke_g.png">연막탄</option>
                    <option value="images/gadgets/stun.png">섬광탄</option>
                    <option value="images/gadgets/claymore.png">대인 지뢰</option>
                    <option value="images/gadgets/breach.png">접착 폭약</option>
                    <option value="images/gadgets/hard_breach.png">강력 접착 폭약</option>
					<option value="images/gadgets/emp.png">충격 EMP 수류탄</option>
                    <option value="images/gadgets/barbed.png">철조망</option>
                    <option value="images/gadgets/shield.png">이동식 방패</option>
					<option value="images/gadgets/c4.png">원격 제어 폭탄 (C4)</option>
                    <option value="images/gadgets/bulletproof_camera.png">방탄 카메라</option>
                    <option value="images/gadgets/impact_grenade.png">충격 수류탄</option>
                    <option value="images/gadgets/alarm.png">근접 알람</option>
                    <option value="images/gadgets/observation_blocker.png">관측 차단기</option>
					<option value="images/gadgets/barricade.png">바리케이드</option>
                    <option value="images/gadgets/reinforcement.png">강화제</option>
					<option value="images/gadgets/drone.png">드론</option>
                </optgroup>
            </select>
        </div>

        <div id="canvas-container" style="flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; padding: 10px; background: #151515; border-radius: 8px;">
            <canvas id="paintCanvas" width="1280" height="720" style="border: 2px solid #444; box-shadow: 0px 0px 15px rgba(0,0,0,0.5); background-size: contain; background-repeat: no-repeat; background-position: center; background-color: #222; cursor: crosshair; max-width: 100%; max-height: 100%; display: block;"></canvas>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚙️ [유저 설정 구역] 새 맵 추가 및 모든 층수 제어는 여기만 수정하세요!
        // ==========================================
        const r6Config = {
            // "맵 이름": { 지하, 1층, 2층, 3층, 옥상 유무 }
            "오리건":            { hasB1: true,  has1F: true, has2F: true, has3F: false, hasRoof: true },
            "클럽하우스":        	{ hasB1: true,  has1F: true, has2F: true, has3F: false, hasRoof: true },
            "영사관":            { hasB1: true,  has1F: true, has2F: true, has3F: false,  hasRoof: true },
            "은행":             	{ hasB1: true,  has1F: true, has2F: true, has3F: false, hasRoof: true },
            "별장":             	{ hasB1: true,  has1F: true, has2F: true, has3F: false, hasRoof: true },
            "운하":             	{ hasB1: true,  has1F: true, has2F: true, has3F: false, hasRoof: true },
            "도스토예프스키 카페": { hasB1: false, has1F: true, has2F: true, has3F: true,  hasRoof: true },
            "국경":             	{ hasB1: false, has1F: true, has2F: true, has3F: false, hasRoof: true },
            "마천루":            { hasB1: false,  has1F: true, has2F: true, has3F: false,  hasRoof: true },
            "해안선":            { hasB1: false, has1F: true, has2F: true, has3F: false, hasRoof: true },
            "테마파크":          	{ hasB1: false, has1F: true, has2F: true, has3F: false, hasRoof: true },
            "빌라":             	{ hasB1: true,  has1F: true, has2F: true, has3F: false, hasRoof: true },
            "오지":             	{ hasB1: false, has1F: true, has2F: true, has3F: false, hasRoof: true },
            "요새":             	{ hasB1: false, has1F: true, has2F: true, has3F: false, hasRoof: true },
            "나이트헤븐 연구소":  	{ hasB1: true,  has1F: true, has2F: true, has3F: false, hasRoof: true },
            "소굴":             	{ hasB1: true,  has1F: true, has2F: true, has3F: false, hasRoof: true },
            "에메랄드 평원":      { hasB1: false, has1F: true, has2F: true, has3F: false, hasRoof: true },
            "칼립소 카지노":      { hasB1: true,  has1F: true, has2F: true, has3F: false,  hasRoof: true }
        };
        const mapData = {};

        Object.keys(r6Config).forEach(m => {
            const config = r6Config[m];
            mapData[m] = {};

            // 1. 지하 설정
            if (config.hasB1) mapData[m]["지하"] = `images/maps/${m}_b1.png`;

            // 2. 1층 설정
            if (config.has1F) mapData[m]["1층"] = `images/maps/${m}_1f.png`;

            // 3. 2층 설정
            if (config.has2F) mapData[m]["2층"] = `images/maps/${m}_2f.png`;

            // 4. 3층 설정
            if (config.has3F) mapData[m]["3층"] = `images/maps/${m}_3f.png`;

            // 5. 옥상 설정
            if (config.hasRoof) mapData[m]["옥상"] = `images/maps/${m}_roof.png`;
        });

        let currentMap = "", currentMode = "draw", isDrawing = false, lastSelectedFloor = "1층";
        const canvas = document.getElementById('paintCanvas'), ctx = canvas.getContext('2d');
        const colorEl = document.getElementById('brush-color'), sizeEl = document.getElementById('brush-size'), sizeIndicator = document.getElementById('size-indicator');

        let currentSize = sizeEl.value, currentColor = colorEl.value, useRightClickErase = false;

        sizeEl.addEventListener('input', (e) => { currentSize = e.target.value; sizeIndicator.innerText = currentSize; });
        colorEl.addEventListener('change', (e) => { currentColor = e.target.value; });
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        function initMapButtons() {
            const box = document.getElementById('map-box');
            Object.keys(mapData).forEach(name => {
                const btn = document.createElement('button');
                btn.className = 'map-btn';
                btn.innerText = "📍 " + name;
                btn.onclick = () => selectMap(name, btn);
                box.appendChild(btn);
            });
        }
        initMapButtons();

        function selectMap(name, btnElement) {
            currentMap = name;
            document.getElementById('map-title').innerText = name;
            document.querySelectorAll('.map-btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            const fDiv = document.getElementById('floor-buttons');
            fDiv.innerHTML = ""; 
            const floors = Object.keys(mapData[name]);
            let targetFloor = floors.includes(lastSelectedFloor) ? lastSelectedFloor : floors[0];

            floors.forEach(f => {
                const btn = document.createElement('button');
                btn.className = 'floor-btn';
                if(f === targetFloor) btn.classList.add('active');
                btn.innerText = f;
                btn.onclick = () => {
                    lastSelectedFloor = f; 
                    document.querySelectorAll('.floor-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    changeFloor(f);
                };
                fDiv.appendChild(btn);
            });
            changeFloor(targetFloor);
        }

        function changeFloor(f) {
            canvas.style.backgroundImage = "url('" + mapData[currentMap][f] + "')";
            clearCanvas();
        }

        function setMode(m) {
            currentMode = m;
            document.getElementById('btn-draw').classList.toggle('active', m === 'draw');
            document.getElementById('btn-erase').classList.toggle('active', m === 'erase');
			document.getElementById('btn-stamp').classList.toggle('active', m === 'stamp');
        }

        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        // 🛠️ 최적화: 클릭 시 선 그리기 시작 또는 이미지 도장 찍기 분기 처리
        canvas.addEventListener('mousedown', function(e) {
            const p = getCoords(e);
            useRightClickErase = (e.button === 2);

            // 1. 도장 모드이고 왼쪽 클릭(0)일 때 이미지 캔버스에 직접 렌더링 (렉 0%)
            if (currentMode === 'stamp' && e.button === 0) {
                const imgPath = document.getElementById('stamp-selector').value;
                const stampImg = new Image();
                stampImg.src = imgPath;
                stampImg.onload = function() {
                    ctx.globalCompositeOperation = 'source-over';
                    // 클릭한 중심점에 32x32 크기로 아이콘 이미지를 도장처럼 쿵 찍음
                    ctx.drawImage(stampImg, p.x - 16, p.y - 16, 32, 32);
                };
                stampImg.onerror = function() {
                    // 혹시 폴더에 이미지 파일이 아직 없을 때 글자로 대신 찍어주는 방어 코드
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.fillStyle = '#ffb703';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.fillText("📍아이콘없음", p.x - 25, p.y + 4);
                };
                return; // 도장을 찍었으므로 그리기 로직으로 넘어가지 않고 종료
            }

            // 2. 그리기 또는 지우개 모드일 때 기존 뼈대 작동
            isDrawing = true;
            ctx.beginPath();
            ctx.lineCap = 'round'; 
            ctx.lineJoin = 'round'; 
            ctx.lineWidth = currentSize;

            if (currentMode === 'erase' || useRightClickErase) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor; 
            }
            ctx.moveTo(p.x, p.y);
        });

        canvas.addEventListener('mousemove', function(e) {
            // 도장 모드일 때는 마우스를 움직여도 선이 그려지지 않도록 차단
            if (!isDrawing || currentMode === 'stamp') return; 

            const p = getCoords(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke(); 
        });

        canvas.addEventListener('mouseup', () => { isDrawing = false; useRightClickErase = false; });
        canvas.addEventListener('mouseout', () => { isDrawing = false; useRightClickErase = false; });

        function clearCanvas() {
            ctx.globalCompositeOperation = 'source-over';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
